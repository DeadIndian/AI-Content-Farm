name: Verify studio
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTOPILOT_ENABLED: 'false'
      TTS_DOCKER_AUTO_MANAGE: 'false'
      STUDIO_TTS_PROVIDER: espeak
      SHORTS_ENCODER: cpu
      SHORTS_THREADS: '1'
      ALLOW_LOCAL_MODELS: 'false'
      STUDIO_RUN_MEDIA_TESTS: '1'
      STUDIO_RESOURCE_MODE: gentle
      GOMAXPROCS: '1'
      SHORTS_CLIP_REST_SECONDS: '0'
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-studio.lock
            requirements-shorts.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
      - run: pip install -r requirements-studio.lock -r requirements-shorts.txt
      - run: go test -p=1 -race ./... && go vet -p=1 ./...
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: STUDIO_INTEGRATION_ROOT="$PWD" go test ./internal/httpserver -run TestStudioRealPipeline -v
      - run: npm ci && npx playwright install --with-deps chromium
      - name: Start studio
        run: |
          go build -o bin/api ./cmd/api
          ./bin/api > /tmp/studio.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 1
          done
          cat /tmp/studio.log
          exit 1
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: test-results/
